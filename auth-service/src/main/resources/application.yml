server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    # "optional:" means the service still starts if config-server is not running.
    import: "optional:configserver:http://localhost:8888"
  datasource:
    # This service owns its own database; no other service connects to it.
    url: jdbc:postgresql://localhost:5432/infinityhr_auth
    username: ${DB_USERNAME:infinityhr}
    password: ${DB_PASSWORD:infinityhr}
  jpa:
    hibernate:
      # Flyway creates and changes tables; Hibernate only checks that entities match them.
      ddl-auto: validate
      format_sql: true

infinityhr:
  bootstrap:
    admin:
      username: superadmin
      email: superadmin@infinityhr.local
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    issuer: infinity-hr-auth
    access-token-ttl: 15m
    private-key: ${JWT_PRIVATE_KEY_LOCATION:file:${user.home}/.infinityhr/keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:${user.home}/.infinityhr/keys/public.pem}
logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG