server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    # "optional:" means the service still starts if config-server is not running.
    import: "optional:configserver:http://localhost:8888"
  datasource:
    # This service owns its own database; no other service connects to it.
    url: jdbc:postgresql://localhost:5432/infinityhr_notification
    username: ${DB_USERNAME:infinityhr}
    password: ${DB_PASSWORD:infinityhr}
  jpa:
    hibernate:
      # Flyway creates and changes tables; Hibernate only checks that entities match them.
      ddl-auto: validate
